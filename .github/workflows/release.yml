name: Release zrun

on:
  # 仅允许手动触发，版本号格式为 YY.大版本.小版本，例如 26.3.1
  workflow_dispatch:
    inputs:
      bump:
        description: '递增类型（minor: 26.3.1 -> 26.3.2，major: 26.3.1 -> 26.4.0）'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.5'

      - name: Get version info
        id: get_version
        run: |
          # 版本格式：YY.大版本.小版本，例如 26.3.1
          # 规则：取最新 vX.Y.Z 标签；同一年按 bump 递增，跨年则重置为 YY.1.0
          BUMP="${{ inputs.bump }}"
          YY_CUR=$(date +%y)
          LAST_VER=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          echo "Last version: ${LAST_VER:-<none>}, bump: $BUMP, year: $YY_CUR"
          if [ -z "$LAST_VER" ]; then
            NEW_VERSION="$YY_CUR.1.0"
          else
            LAST_YY=$(echo "$LAST_VER" | cut -d. -f1)
            LAST_MAJOR=$(echo "$LAST_VER" | cut -d. -f2)
            LAST_MINOR=$(echo "$LAST_VER" | cut -d. -f3)
            if [ "$LAST_YY" != "$YY_CUR" ]; then
              NEW_VERSION="$YY_CUR.1.0"
            elif [ "$BUMP" = "major" ]; then
              NEW_VERSION="$YY_CUR.$((LAST_MAJOR + 1)).0"
            else
              NEW_VERSION="$YY_CUR.$LAST_MAJOR.$((LAST_MINOR + 1))"
            fi
          fi
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # 从 src/version/version.go 提取 SyntaxVersion
          SYNTAX_VERSION=$(grep "SyntaxVersion =" src/version/version.go | cut -d '"' -f 2)
          echo "SYNTAX_VERSION=$SYNTAX_VERSION" >> $GITHUB_ENV
          echo "syntax_version=$SYNTAX_VERSION" >> $GITHUB_OUTPUT

          echo "Version: $NEW_VERSION, Syntax Version: $SYNTAX_VERSION"

      - name: Update versions in files
        run: |
          NEW_VERSION=$NEW_VERSION
          SYNTAX_VERSION=$SYNTAX_VERSION
          # 更新 src/version/version.go 中的版本（版本唯一来源）
          sed -i "s/const Version = \".*\"/const Version = \"$NEW_VERSION\"/" src/version/version.go
          # 更新 version.json 中的版本
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/" version.json
          sed -i "s/\"syntax_version\": \".*\"/\"syntax_version\": \"$SYNTAX_VERSION\"/" version.json

          # 显示更改
          echo "Updated src/version/version.go:"
          grep "const Version" src/version/version.go
          echo "Updated version.json:"
          cat version.json

      - name: Commit version changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com" >&2
          git config --local user.name "github-actions[bot]" >&2
          git add src/version/version.go version.json

          # 检查是否有更改，如果有则提交
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Update to version $NEW_VERSION"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build for all platforms
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/zrun-windows-amd64.exe .
          GOOS=linux GOARCH=amd64 go build -o dist/zrun-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/zrun-macos-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/zrun-macos-arm64 .

      - name: Get last release tag
        id: last_release
        run: |
          # 获取上一个标签，排除当前正在创建的新标签格式
          # 先获取所有标签，然后找到在当前提交之前的最近标签
          CURRENT_COMMIT=$(git rev-parse HEAD)
          LAST_TAG=$(git tag --sort=-creatordate --format='%(refname:short)' | while read tag; do
            if [[ "$(git rev-parse $tag)" != "$CURRENT_COMMIT" ]]; then
              echo "$tag"
              break
            fi
          done)

          if [ -z "$LAST_TAG" ]; then
            # 如果没有找到，使用初始提交
            LAST_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "LAST_TAG=$LAST_TAG" >> $GITHUB_ENV
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Get commit history
        id: commits
        run: |
          LAST_TAG=$LAST_TAG
          # 获取从上次发布以来的所有提交，排除合并和依赖更新
          # 如果是初始提交，则获取最近的10条提交
          if [[ "$LAST_TAG" == "$(git rev-list --max-parents=0 HEAD)" ]]; then
            COMMIT_LOG=$(git log --oneline -10 --pretty=format:"%h - %an: %s" | grep -vE "Merge|dependabot|Update to version")
          else
            COMMIT_LOG=$(git log $LAST_TAG..HEAD --oneline --pretty=format:"%h - %an: %s" | grep -vE "Merge|dependabot|Update to version")

            # 如果没有找到符合条件的提交，使用最近的提交
            if [ -z "$COMMIT_LOG" ]; then
              COMMIT_LOG=$(git log --oneline -10 --pretty=format:"%h - %an: %s" | grep -vE "Merge|dependabot|Update to version")
            fi
          fi

          echo "COMMIT_LOG<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_LOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # 获取从上个标签以来的贡献者列表，排除机器人账号
          if [[ "$LAST_TAG" == "$(git rev-list --max-parents=0 HEAD)" ]]; then
            CONTRIBUTORS=$(git log --pretty=format:"%an" | grep -v "dependabot" | grep -v "github-actions" | sort -u | sed 's/^/- /' | tr '\n' '\n')
          else
            CONTRIBUTORS=$(git log $LAST_TAG..HEAD --pretty=format:"%an" | grep -v "dependabot" | grep -v "github-actions" | sort -u | sed 's/^/- /' | tr '\n' '\n')
          fi

          if [ -z "$(echo "$CONTRIBUTORS" | tr -d '\n')" ]; then
            CONTRIBUTORS="- No human contributors since last release"
          fi
          echo "CONTRIBUTORS<<EOF" >> $GITHUB_ENV
          echo "$CONTRIBUTORS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate release notes
        id: release_notes
        run: |
          # 生成包含提交历史和贡献者的发布说明
          RELEASE_NOTES="# 更新日志 🚀

          ## 🛠️ 本次更新内容
          \`\`\`log
          ${{ env.COMMIT_LOG }}
          \`\`\`

          ## 👥 参与贡献
          ${{ env.CONTRIBUTORS }}

          ## 🔧 构建信息
          - 语法版本: ${{ env.SYNTAX_VERSION }}
          - 构建时间: $(date)
          - 上次发布: ${{ env.LAST_TAG }}
          "

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          files: |
            dist/zrun-windows-amd64.exe
            dist/zrun-linux-amd64
            dist/zrun-macos-amd64
            dist/zrun-macos-arm64